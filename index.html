    <h1>The Democracy Game</h1>
    <p>The Democracy Game is a political simulation of decision-making. Players can choose between several
      different political environments, and between the role of powerful individuals or ordinary citizens, and
      then experience evolving dilemmas that walk the line between personal lives and the public sphere. The goal
      of the game is to serve as a tool for exploring decision-making processes and self-identity perception, as
      well as an educational tool for encouraging political awareness and literacy. The game emphasizes issues of
      liberalism, autonomy, and democracy.</p>
    <p>In the game, we use an extensive theoretical background and generative artificial intelligence to challenge
      players' values and respond to their choices dynamically, as well as to provide feedback and reflect on
      values, considerations, and insights resulting from their actions.</p>
    <p>This project was generously funded by PUMBY and is an inter-university research effort. Enable JavaScript to
      explore the full site.</p>
